<!DOCTYPE html>
<html>
<head>
    <title>CatchTheBox</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: white;
        }

        h1 {
            margin-top: 20px;
        }

        #score {
            font-size: 24px;
            margin: 10px;
        }

        #game {
            width: 90%;
            max-width: 600px;
            height: 400px;
            background: #333;
            border: 3px solid white;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }

        #box {
            width: 50px;
            height: 50px;
            background: red;
            position: absolute;
            cursor: pointer;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🎮 Tangkap Kotak</h1>

    <div id="score">Skor: 0</div>

    <button onclick="startGame()">Mulai Game</button>

    <div id="game">
        <div id="box" onclick="hitBox()"></div>
    </div>

    <script>
        let score = 0;

        const box = document.getElementById("box");
        const game = document.getElementById("game");

        function startGame() {
            score = 0;
            document.getElementById("score").innerText = "Skor: 0";
            moveBox();
        }

        function hitBox() {
            score++;
            document.getElementById("score").innerText =
                "Skor: " + score;

            moveBox();
        }

        function moveBox() {
            let maxX = game.clientWidth - box.clientWidth;
            let maxY = game.clientHeight - box.clientHeight;

            let x = Math.random() * maxX;
            let y = Math.random() * maxY;

            box.style.left = x + "px";
            box.style.top = y + "px";
        }
    </script>

</body>
<p><a href="index.html">Kembali Ke Menu Utama</a></p>
</html>
